name: Build DAV Service

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Verify production files
        run: |
          test -f dist/index.html
          test -f dist/js/app.min.js
          test -f dist/css/app.min.css
          if grep -R "SUPABASE_SERVICE_ROLE_KEY" dist; then exit 1; fi

      - name: Commit updated production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Production bundle is already up to date."
            exit 0
          fi
          git commit -m "build: update production bundle [skip ci]"
          git push

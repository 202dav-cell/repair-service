name: Build DAV Service

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Verify production files
        run: |
          test -f dist/index.html
          test -f dist/js/app.min.js
          test -f dist/css/app.min.css
          if grep -R "SUPABASE_SERVICE_ROLE_KEY" dist; then exit 1; fi

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAV Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="loginScreen">
    <div class="login-box">
        <h1>🔧 DAV Service</h1>
        <p>Вход в систему</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Введите email" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль" required>

            <button type="submit" class="primary-button login-button">Войти</button>
            <div id="loginError" class="error"></div>
        </form>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="logo">🔧 DAV Service</div>

        <div>
            <span id="userInfo" class="user-info">Загрузка...</span>
            <button id="logoutButton" class="logout-button">Выйти</button>
        </div>
    </div>

    <div class="container">

        <div class="counters">
            <div class="counter">
                <div class="counter-title">Новые</div>
                <div id="counterNew" class="counter-value">0</div>
            </div>

            <div class="counter">
                <div class="counter-title">В ремонте</div>
                <div id="counterRepair" class="counter-value">0</div>
            </div>

            <div class="counter overdue">
                <div class="counter-title">Просрочено</div>
                <div id="counterOverdue" class="counter-value">0</div>
            </div>

            <div class="counter">
                <div class="counter-title">К выдаче</div>
                <div id="counterReady" class="counter-value">0</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="NEW">Новые</button>
            <button class="tab" data-tab="IN_REPAIR">В ремонте</button>
            <button class="tab" data-tab="OVERDUE">🔴 Просрочено</button>
            <button class="tab" data-tab="READY">К выдаче</button>
            <button class="tab" data-tab="ARCHIVE">Архив</button>
        </div>

        <div class="content-box">
            <div class="content-header">
                <h2 id="pageTitle">Новые ремонты</h2>

                <div class="header-buttons">
                    <button id="newRepairButton" class="new-repair-button">+ Новый ремонт</button>
                    <button id="refreshButton" class="refresh-button">🔄 Обновить</button>
                </div>
            </div>

            <div id="tableContainer" class="loading">Загрузка...</div>
        </div>

    </div>
</div>

<div id="newRepairModal" class="modal-overlay">
    <div class="modal">

        <div class="modal-header">
            <h2>Новый ремонт</h2>
            <button id="closeModalButton" class="close-button">×</button>
        </div>

        <div class="modal-body">

            <div id="formMessage" class="form-message"></div>

            <form id="newRepairForm">

                <div class="form-section">
                    <h3>👤 Клиент</h3>

                    <div class="form-row">
                        <div>
                            <label for="clientName">ФИО клиента *</label>
                            <input type="text" id="clientName" placeholder="Начните вводить ФИО..." list="clientsList" required>
                        </div>

                        <div>
                            <label for="clientPhone">Телефон *</label>
                            <input type="tel" id="clientPhone" placeholder="+375..." required>
                        </div>
                    </div>

                </div>

                <div class="form-section">
                    <h3>🔧 Оборудование</h3>

                    <div class="form-row">
                        <div>
                            <label for="equipmentName">Оборудование *</label>
                            <input type="text" id="equipmentName" placeholder="Например: ноутбук" required>
                        </div>

                        <div>
                            <label for="brand">Бренд / производитель</label>
                            <input type="text" id="brand" placeholder="Например: Lenovo">
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label for="model">Модель</label>
                            <input type="text" id="model" placeholder="Например: ThinkPad T14">
                        </div>

                        <div>
                            <label for="serialNumber">Серийный номер</label>
                            <input type="text" id="serialNumber" placeholder="S/N">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>⚠️ Проблема</h3>

                    <label for="customerProblem">Что сообщил клиент *</label>
                    <textarea id="customerProblem" placeholder="Опишите проблему со слов клиента..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelModalButton" class="cancel-button">Отмена</button>
                    <button type="submit" id="saveRepairButton" class="save-button">Сохранить ремонт</button>
                </div>

            </form>

        </div>
    </div>
</div>

<datalist id="clientsList"></datalist>

<script src="js/config/supabase.js"></script>
<script src="js/core/state.js"></script>
<script src="js/utils/format.js"></script>
<script src="js/utils/html.js"></script>

<script src="js/services/auth.service.js"></script>
<script src="js/services/clients.service.js"></script>
<script src="js/services/repairs.service.js"></script>

<script src="js/ui/auth.ui.js"></script>
<script src="js/ui/repairs.ui.js"></script>
<script src="js/ui/clients.ui.js"></script>
<script src="js/ui/repair-modal.ui.js"></script>

<script src="js/app.js"></script>

</body>
</html>

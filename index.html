
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAV Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .login-box h1 {
            margin-top: 0;
            text-align: center;
        }

        .login-box p {
            text-align: center;
            color: #777;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 7px;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 14px;
            cursor: pointer;
        }

        .primary-button {
            background: #2563eb;
            color: white;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .login-button {
            width: 100%;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
            text-align: center;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
            min-height: 100vh;
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .user-info {
            font-size: 13px;
            color: #d1d5db;
            margin-right: 15px;
        }

        .logout-button {
            background: #374151;
            color: white;
        }

        .logout-button:hover {
            background: #4b5563;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
        }

        /* =========================
           COUNTERS
        ========================= */

        .counters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .counter {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .counter-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .counter-value {
            font-size: 30px;
            font-weight: bold;
        }

        .counter.overdue .counter-value {
            color: #dc2626;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            background: white;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .tab {
            background: transparent;
            color: #374151;
            white-space: nowrap;
        }

        .tab:hover {
            background: #f3f4f6;
        }

        .tab.active {
            background: #2563eb;
            color: white;
        }

        /* =========================
           CONTENT
        ========================= */

        .content-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .content-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .content-header h2 {
            margin: 0;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .new-repair-button {
            background: #16a34a;
            color: white;
        }

        .new-repair-button:hover {
            background: #15803d;
        }

        .refresh-button {
            background: #f3f4f6;
            color: #374151;
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f9fafb;
            text-align: left;
            padding: 13px;
            font-size: 13px;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 14px 13px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .repair-number {
            font-weight: bold;
            color: #2563eb;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-new {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-repair {
            background: #fef3c7;
            color: #92400e;
        }

        .status-ready {
            background: #dcfce7;
            color: #166534;
        }

        .status-issued {
            background: #e5e7eb;
            color: #374151;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .overdue-row td {
            background: #fff1f2;
        }

        .overdue-label {
            color: #dc2626;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #9ca3af;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal {
            width: 100%;
            max-width: 750px;
            background: white;
            margin: 30px auto;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            background: #f3f4f6;
            color: #374151;
            font-size: 20px;
            width: 40px;
            height: 40px;
            padding: 0;
        }

        .modal-body {
            padding: 25px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 17px;
            color: #111827;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 10px;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #374151;
        }

        .save-button {
            background: #16a34a;
            color: white;
        }

        .save-button:hover {
            background: #15803d;
        }

        .form-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .form-message.error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        .form-message.success-message {
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .topbar {
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                padding: 15px;
            }

            .counters {
                grid-template-columns: repeat(2, 1fr);
            }

            .content-header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-buttons {
                flex-direction: column;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {

            .counters {
                gap: 10px;
            }

            .counter {
                padding: 15px;
            }

            .counter-value {
                font-size: 24px;
            }

            .modal-overlay {
                padding: 10px;
            }

            .modal {
                margin: 10px auto;
            }

            .modal-body {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

    <div class="login-box">

        <h1>🔧 DAV Service</h1>

        <p>Вход в систему</p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Введите email"
                required
            >

            <label for="password">
                Пароль
            </label>

            <input
                type="password"
                id="password"
                placeholder="Введите пароль"
                required
            >

            <button
                type="submit"
                class="primary-button login-button"
            >
                Войти
            </button>

            <div
                id="loginError"
                class="error"
            ></div>

        </form>

    </div>

</div>


<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="app">

    <div class="topbar">

        <div class="logo">
            🔧 DAV Service
        </div>

        <div>

            <span
                id="userInfo"
                class="user-info"
            >
                Загрузка...
            </span>

            <button
                id="logoutButton"
                class="logout-button"
            >
                Выйти
            </button>

        </div>

    </div>


    <div class="container">

        <!-- COUNTERS -->

        <div class="counters">

            <div class="counter">

                <div class="counter-title">
                    Новые
                </div>

                <div
                    id="counterNew"
                    class="counter-value"
                >
                    0
                </div>

            </div>


            <div class="counter">

                <div class="counter-title">
                    В ремонте
                </div>

                <div
                    id="counterRepair"
                    class="counter-value"
                >
                    0
                </div>

            </div>


            <div class="counter overdue">

                <div class="counter-title">
                    Просрочено
                </div>

                <div
                    id="counterOverdue"
                    class="counter-value"
                >
                    0
                </div>

            </div>


            <div class="counter">

                <div class="counter-title">
                    К выдаче
                </div>

                <div
                    id="counterReady"
                    class="counter-value"
                >
                    0
                </div>

            </div>

        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                data-tab="NEW"
            >
                Новые
            </button>

            <button
                class="tab"
                data-tab="IN_REPAIR"
            >
                В ремонте
            </button>

            <button
                class="tab"
                data-tab="OVERDUE"
            >
                🔴 Просрочено
            </button>

            <button
                class="tab"
                data-tab="READY"
            >
                К выдаче
            </button>

            <button
                class="tab"
                data-tab="ARCHIVE"
            >
                Архив
            </button>

        </div>


        <!-- TABLE -->

        <div class="content-box">

            <div class="content-header">

                <h2 id="pageTitle">
                    Новые ремонты
                </h2>

                <div class="header-buttons">

                    <button
                        id="newRepairButton"
                        class="new-repair-button"
                    >
                        + Новый ремонт
                    </button>

                    <button
                        id="refreshButton"
                        class="refresh-button"
                    >
                        🔄 Обновить
                    </button>

                </div>

            </div>


            <div
                id="tableContainer"
                class="loading"
            >
                Загрузка...
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     NEW REPAIR MODAL
===================================================== -->

<div
    id="newRepairModal"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                Новый ремонт
            </h2>

            <button
                id="closeModalButton"
                class="close-button"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div
                id="formMessage"
                class="form-message"
            ></div>


            <form id="newRepairForm">

                <!-- CLIENT -->

                <div class="form-section">

                    <h3>
                        👤 Клиент
                    </h3>

                    <div class="form-row">

                        <div>

                            <label for="clientName">
                                ФИО клиента *
                            </label>

                           <input
    type="text"
    id="clientName"
    placeholder="Начните вводить ФИО..."
    list="clientsList"
    required
>

                        </div>


                        <div>

                            <label for="clientPhone">
                                Телефон *
                            </label>

                            <input
                                type="tel"
                                id="clientPhone"
                                placeholder="+375..."
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- EQUIPMENT -->

                <div class="form-section">

                    <h3>
                        🔧 Оборудование
                    </h3>


                    <div class="form-row">

                        <div>

                            <label for="equipmentName">
                                Оборудование *
                            </label>

                            <input
                                type="text"
                                id="equipmentName"
                                placeholder="Например: ноутбук"
                                required
                            >

                        </div>


                        <div>

                            <label for="brand">
                                Бренд / производитель
                            </label>

                            <input
                                type="text"
                                id="brand"
                                placeholder="Например: Lenovo"
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div>

                            <label for="model">
                                Модель
                            </label>

                            <input
                                type="text"
                                id="model"
                                placeholder="Например: ThinkPad T14"
                            >

                        </div>


                        <div>

                            <label for="serialNumber">
                                Серийный номер
                            </label>

                            <input
                                type="text"
                                id="serialNumber"
                                placeholder="S/N"
                            >

                        </div>

                    </div>

                </div>


                <!-- PROBLEM -->

                <div class="form-section">

                    <h3>
                        ⚠️ Проблема
                    </h3>

                    <label for="customerProblem">
                        Что сообщил клиент *
                    </label>

                    <textarea
                        id="customerProblem"
                        placeholder="Опишите проблему со слов клиента..."
                        required
                    ></textarea>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelModalButton"
                        class="cancel-button"
                    >
                        Отмена
                    </button>

                    <button
                        type="submit"
                        id="saveRepairButton"
                        class="save-button"
                    >
                        Сохранить ремонт
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    'https://xuhpdymilkoksowgefhr.supabase.co';


/*
   ВСТАВЬ СЮДА СВОЙ PUBLISHABLE KEY.
   SECRET KEY НЕ ИСПОЛЬЗОВАТЬ.
*/

const SUPABASE_KEY =
    'sb_publishable_Id3MLPNpCV-CAL3gpyhqog_eqxeB2ZA';


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let allRepairs = [];

let currentTab = 'NEW';


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
    document.getElementById('loginScreen');

const app =
    document.getElementById('app');

const loginForm =
    document.getElementById('loginForm');

const loginError =
    document.getElementById('loginError');

const newRepairModal =
    document.getElementById('newRepairModal');

const newRepairForm =
    document.getElementById('newRepairForm');

const formMessage =
    document.getElementById('formMessage');


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();

        loginError.textContent = '';

        const email =
            document.getElementById('email')
                .value
                .trim();

        const password =
            document.getElementById('password')
                .value;


        const {
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            loginError.textContent =
                'Ошибка входа: ' + error.message;

            return;
        }


        await showApplication();

    }
);


/* =====================================================
   SHOW APP
===================================================== */

async function showApplication() {

    loginScreen.style.display = 'none';

    app.style.display = 'block';

    await loadUser();

    await loadRepairs();

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if (!user) {
        return;
    }


    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from('profiles')
        .select('full_name, role')
        .eq('id', user.id)
        .single();


    if (error) {

        document.getElementById(
            'userInfo'
        ).textContent =
            user.email;

        return;
    }


    document.getElementById(
        'userInfo'
    ).textContent =
        (profile.full_name || user.email)
        + ' • '
        + profile.role;

}


/* =====================================================
   LOAD REPAIRS
===================================================== */

async function loadRepairs() {

    const container =
        document.getElementById(
            'tableContainer'
        );


    container.innerHTML =
        '<div class="loading">Загрузка ремонтов...</div>';


    const {
        data,
        error
    } =
    await supabaseClient
        .from('repair_overview')
        .select('*')
        .order(
            'created_at',
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">'
            + escapeHtml(error.message)
            + '</div>';

        return;
    }


    allRepairs = data || [];


    updateCounters();

    renderCurrentTab();

}


/* =====================================================
   COUNTERS
===================================================== */

function updateCounters() {

    const newCount =
        allRepairs.filter(
            repair =>
                repair.status === 'NEW'
        ).length;


    const repairCount =
        allRepairs.filter(
            repair =>
                repair.status === 'IN_REPAIR'
        ).length;


    const overdueCount =
        allRepairs.filter(
            repair =>
                repair.status === 'IN_REPAIR'
                &&
                repair.is_overdue === true
        ).length;


    const readyCount =
        allRepairs.filter(
            repair =>
                repair.status === 'READY'
        ).length;


    document.getElementById(
        'counterNew'
    ).textContent = newCount;


    document.getElementById(
        'counterRepair'
    ).textContent = repairCount;


    document.getElementById(
        'counterOverdue'
    ).textContent = overdueCount;


    document.getElementById(
        'counterReady'
    ).textContent = readyCount;

}


/* =====================================================
   TABS
===================================================== */

document
    .querySelectorAll('.tab')
    .forEach(
        button => {

            button.addEventListener(
                'click',
                function() {

                    document
                        .querySelectorAll('.tab')
                        .forEach(
                            b =>
                                b.classList.remove('active')
                        );


                    this.classList.add('active');


                    currentTab =
                        this.dataset.tab;


                    renderCurrentTab();

                }
            );

        }
    );


/* =====================================================
   RENDER CURRENT TAB
===================================================== */

function renderCurrentTab() {

    let repairs = [];


    if (currentTab === 'NEW') {

        repairs =
            allRepairs.filter(
                repair =>
                    repair.status === 'NEW'
            );

        document.getElementById(
            'pageTitle'
        ).textContent =
            'Новые ремонты';

    }


    else if (currentTab === 'IN_REPAIR') {

        repairs =
            allRepairs.filter(
                repair =>
                    repair.status === 'IN_REPAIR'
            );

        document.getElementById(
            'pageTitle'
        ).textContent =
            'Ремонты в работе';

    }


    else if (currentTab === 'OVERDUE') {

        repairs =
            allRepairs.filter(
                repair =>
                    repair.status === 'IN_REPAIR'
                    &&
                    repair.is_overdue === true
            );

        document.getElementById(
            'pageTitle'
        ).textContent =
            'Просроченные ремонты';

    }


    else if (currentTab === 'READY') {

        repairs =
            allRepairs.filter(
                repair =>
                    repair.status === 'READY'
            );

        document.getElementById(
            'pageTitle'
        ).textContent =
            'Готово к выдаче';

    }


    else if (currentTab === 'ARCHIVE') {

        repairs =
            allRepairs.filter(
                repair =>
                    repair.status === 'ISSUED'
                    ||
                    repair.status === 'CANCELLED'
            );

        document.getElementById(
            'pageTitle'
        ).textContent =
            'Архив';

    }


    renderTable(repairs);

}


/* =====================================================
   TABLE
===================================================== */

function renderTable(repairs) {

    const container =
        document.getElementById(
            'tableContainer'
        );


    if (!repairs.length) {

        container.innerHTML =
            '<div class="empty">'
            + 'Здесь пока нет ремонтов'
            + '</div>';

        return;
    }


    let html = '';

    html += '<div class="table-wrapper>';

    html += '<table>';

    html += '<thead>';

    html += '<tr>';

    html += '<th>№ ремонта</th>';
    html += '<th>Оборудование</th>';
    html += '<th>Бренд</th>';
    html += '<th>Модель</th>';
    html += '<th>Серийный номер</th>';
    html += '<th>Проблема клиента</th>';
    html += '<th>Статус</th>';
    html += '<th>Дата</th>';
    html += '<th>Дней</th>';

    html += '</tr>';

    html += '</thead>';

    html += '<tbody>';


    repairs.forEach(
        repair => {

            const overdue =
                repair.status === 'IN_REPAIR'
                &&
                repair.is_overdue === true;


            html += '<tr class="'
                + (
                    overdue
                    ? 'overdue-row'
                    : ''
                )
                + '">';


            html += '<td>'
                + '<span class="repair-number">'
                + escapeHtml(
                    formatRepairNumber(
                        repair.repair_number
                    )
                )
                + '</span>'
                + '</td>';


            html += '<td>'
                + escapeHtml(
                    repair.equipment_name || '—'
                )
                + '</td>';


            html += '<td>'
                + escapeHtml(
                    repair.brand || '—'
                )
                + '</td>';


            html += '<td>'
                + escapeHtml(
                    repair.model || '—'
                )
                + '</td>';


            html += '<td>'
                + escapeHtml(
                    repair.serial_number || '—'
                )
                + '</td>';


            html += '<td>'
                + escapeHtml(
                    repair.customer_problem || '—'
                )
                + '</td>';


            html += '<td>'
                + getStatusHtml(
                    repair.status,
                    overdue
                )
                + '</td>';


            html += '<td>'
                + formatDate(
                    repair.created_at
                )
                + '</td>';


            html += '<td>'
                + (
                    repair.days_in_repair !== null
                    &&
                    repair.days_in_repair !== undefined
                    ?
                    escapeHtml(
                        String(
                            repair.days_in_repair
                        )
                    )
                    :
                    '—'
                )
                + '</td>';


            html += '</tr>';

        }
    );


    html += '</tbody>';

    html += '</table>';

    html += '</div>';


    container.innerHTML = html;

}


/* =====================================================
   STATUS
===================================================== */

function getStatusHtml(
    status,
    overdue
) {

    if (status === 'NEW') {

        return `
            <span class="status status-new">
                НОВАЯ
            </span>
        `;

    }


    if (status === 'IN_REPAIR') {

        if (overdue) {

            return `
                <span class="status status-repair">
                    В РЕМОНТЕ
                </span>
                <br>
                <span class="overdue-label">
                    ПРОСРОЧЕНО
                </span>
            `;

        }


        return `
            <span class="status status-repair">
                В РЕМОНТЕ
            </span>
        `;

    }


    if (status === 'READY') {

        return `
            <span class="status status-ready">
                ГОТОВО
            </span>
        `;

    }


    if (status === 'ISSUED') {

        return `
            <span class="status status-issued">
                ВЫДАНО
            </span>
        `;

    }


    if (status === 'CANCELLED') {

        return `
            <span class="status status-cancelled">
                ОТМЕНА
            </span>
        `;

    }


    return escapeHtml(
        status || '—'
    );

}

/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatRepairNumber(number) {

    if (
        number === null
        ||
        number === undefined
    ) {

        return '—';

    }


    return String(number)
        .padStart(6, '0');

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    if (!date) {

        return '—';

    }


    const d =
        new Date(date);


    if (isNaN(d.getTime())) {

        return '—';

    }


    return d.toLocaleDateString(
        'ru-RU',
        {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    if (
        value === null
        ||
        value === undefined
    ) {

        return '';

    }


    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}
